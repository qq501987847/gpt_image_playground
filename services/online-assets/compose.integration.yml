services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: awai
      POSTGRES_USER: awai
      POSTGRES_PASSWORD: awai-test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U awai -d awai']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: awai-test
      MINIO_ROOT_PASSWORD: awai-test-secret
    ports:
      - '59000:9000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 awai-test awai-test-secret &&
      mc mb --ignore-existing local/awai-assets &&
      mc ilm rule add --expire-days 1 local/awai-assets
      "
