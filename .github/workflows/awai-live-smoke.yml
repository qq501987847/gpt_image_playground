name: AWAI deployed smoke

on:
  workflow_dispatch:
    inputs:
      confirm_model_charges:
        description: Confirm that this run creates four billable model requests
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.confirm_model_charges == true }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWAI_SMOKE_CONFIRM_CHARGES: I_ACCEPT_MODEL_CHARGES
      AWAI_SMOKE_WEB_ORIGIN: ${{ vars.AWAI_WEB_ORIGIN }}
      AWAI_SMOKE_ASSET_SERVICE_ORIGIN: ${{ vars.AWAI_ASSET_SERVICE_URL }}
      AWAI_SMOKE_SUB2API_ORIGIN: ${{ vars.AWAI_SUB2API_BASE_URL }}
      AWAI_SMOKE_MENU_JWT: ${{ secrets.AWAI_SMOKE_MENU_JWT }}
      AWAI_SMOKE_USER_ID: ${{ secrets.AWAI_SMOKE_USER_ID }}
      AWAI_SMOKE_KEY_ID: ${{ vars.AWAI_SMOKE_KEY_ID }}
      AWAI_SMOKE_EXPECTED_VERSION: ${{ vars.AWAI_RELEASE_VERSION }}
      AWAI_SMOKE_OPENAI_IMAGE_MODEL: ${{ vars.AWAI_SMOKE_OPENAI_IMAGE_MODEL }}
      AWAI_SMOKE_RESPONSES_MODEL: ${{ vars.AWAI_SMOKE_RESPONSES_MODEL }}
      AWAI_SMOKE_GEMINI_MODEL: ${{ vars.AWAI_SMOKE_GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/liveSmoke.mjs
