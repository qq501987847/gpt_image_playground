name: AWAI release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awai-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_AWAI_SUB2API_ALLOWED_ORIGINS: ${{ vars.AWAI_SUB2API_ALLOWED_ORIGINS }}
  VITE_AWAI_SUPPORT_URL: ${{ vars.AWAI_SUPPORT_URL }}
  VITE_AWAI_ASSET_SERVICE_URL: ${{ vars.AWAI_ASSET_SERVICE_URL }}
  VITE_AWAI_RELEASE_MODE: 'true'
  AWAI_SUB2API_ALLOWED_ORIGINS: ${{ vars.AWAI_SUB2API_ALLOWED_ORIGINS }}
  AWAI_WEB_ALLOWED_ORIGINS: ${{ vars.AWAI_WEB_ALLOWED_ORIGINS }}
  DATABASE_URL: ${{ secrets.AWAI_RELEASE_DATABASE_URL }}
  S3_BUCKET: ${{ vars.AWAI_S3_BUCKET }}
  S3_REGION: ${{ vars.AWAI_S3_REGION }}
  S3_ENDPOINT: ${{ vars.AWAI_S3_ENDPOINT }}
  AWAI_SUB2API_BASE_URL: ${{ vars.AWAI_SUB2API_BASE_URL }}
  AWAI_SUPPORT_URL: ${{ vars.AWAI_SUPPORT_URL }}
  AWAI_BUNDLE_IDENTIFIER: ${{ vars.AWAI_BUNDLE_IDENTIFIER }}

jobs:
  verify-and-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: node scripts/releaseConfig.mjs check all
      - run: npm run build
      - run: npm run release:check:artifact
      - run: npm test
      - run: npm run build:online-assets
      - run: npm run test:online-assets
      - name: Verify PostgreSQL and S3 lifecycle adapters
        shell: bash
        run: |
          docker compose -f services/online-assets/compose.integration.yml up -d --wait postgres minio
          docker compose -f services/online-assets/compose.integration.yml run --rm minio-init
          AWAI_INTEGRATION_TEST=1 npm run test:online-assets:integration
      - name: Stop integration services
        if: always()
        run: docker compose -f services/online-assets/compose.integration.yml down -v
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Package Web and Node service
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-out/online-assets
          tar -czf "release-out/awai-web-${version}.tar.gz" -C dist .
          cp -R services/online-assets/dist services/online-assets/migrations services/online-assets/Dockerfile package.json package-lock.json LICENSE release-out/online-assets/
          tar -czf "release-out/awai-online-assets-${version}.tar.gz" -C release-out online-assets
          rm -rf release-out/online-assets

      - name: Build deployable Node service image
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          docker build -f services/online-assets/Dockerfile -t "awai-online-assets:${version}" .
          docker save "awai-online-assets:${version}" | gzip > "release-out/awai-online-assets-${version}-image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: awai-web-node
          path: release-out/*
          if-no-files-found: error

  desktop:
    needs: verify-and-online
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      VITE_AWAI_SUPPORT_URL: ${{ vars.AWAI_SUPPORT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci
      - run: npm run release:prepare:desktop
      - run: npm run tauri build -- --config release-out/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: awai-desktop-${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            LICENSE
          if-no-files-found: error

  manifest:
    needs: [verify-and-online, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-out
          merge-multiple: true

      - run: cp RELEASE.md release-out/RELEASE_RECORD.md
      - run: node scripts/releaseHashes.mjs release-out

      - uses: actions/upload-artifact@v4
        with:
          name: awai-release-manifest
          path: |
            release-out/SHA256SUMS
            release-out/RELEASE_RECORD.md
          if-no-files-found: error
